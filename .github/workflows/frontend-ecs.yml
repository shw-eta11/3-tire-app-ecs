name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
  workflow_dispatch:
    inputs:
      bump_major:
        description: "Bump MAJOR version?"
        type: boolean
        default: false
      bump_minor:
        description: "Bump MINOR version?"
        type: boolean
        default: false
      bump_patch:
        description: "Bump PATCH version?"
        type: boolean
        default: true

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    env:
      CLUSTER_NAME: cluster-1
      SERVICE_NAME: frontend-task-service-ql1lkjuv
      TASK_FAMILY: frontend-task
      ECR_REPOSITORY: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      ############################################################
      # 1️⃣ Get Highest Semantic Version From ECR
      ############################################################
      - name: Get latest semantic version
        id: get-latest
        run: |
          TAGS=$(aws ecr describe-images \
            --repository-name $ECR_REPOSITORY \
            --query 'imageDetails[].imageTags[]' \
            --output text 2>/dev/null | tr '\t' '\n' \
            | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' || true)

          if [ -z "$TAGS" ]; then
            echo "No valid semantic versions found."
            LATEST_TAG="0.0.0"
          else
            LATEST_TAG=$(echo "$TAGS" | sed 's/^v//' | sort -V | tail -n1)
            echo "Highest semantic version found: $LATEST_TAG"
          fi

          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV

      ############################################################
      # 2️⃣ Validate Version Format
      ############################################################
      - name: Validate version format
        run: |
          if [[ ! "$LATEST_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format: $LATEST_TAG"
            exit 1
          fi

      ############################################################
      # 3️⃣ Bump Version
      ############################################################
      - name: Bump version
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_TAG"

          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          if [ "${{ github.event.inputs.bump_major }}" == "true" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "${{ github.event.inputs.bump_minor }}" == "true" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          NEW_TAG="v$NEW_VERSION"

          echo "Deploying version: $NEW_TAG"

          echo "$NEW_TAG" > frontend/VERSION
          echo "IMAGE_TAG=$NEW_TAG" >> $GITHUB_ENV

      ############################################################
      # 4️⃣ Build & Push Docker Image
      ############################################################
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push Frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          cd frontend
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      ############################################################
      # 5️⃣ Save Current Task Definition (for rollback)
      ############################################################
      - name: Save current task definition
        run: |
          CURRENT_TASK_DEF=$(aws ecs describe-services \
            --cluster $CLUSTER_NAME \
            --services $SERVICE_NAME \
            --query 'services[0].taskDefinition' \
            --output text)

          echo "CURRENT_TASK_DEF=$CURRENT_TASK_DEF" >> $GITHUB_ENV

      ############################################################
      # 6️⃣ Register New Task Definition
      ############################################################
      - name: Get current task definition JSON
        run: |
          aws ecs describe-task-definition \
            --task-definition $TASK_FAMILY \
            --query taskDefinition > task-def.json

      - name: Update task definition with new image
        run: |
          NEW_IMAGE=${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG

          cat task-def.json | jq --arg IMAGE "$NEW_IMAGE" \
          '.containerDefinitions[0].image = $IMAGE
          | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,
                .compatibilities,.registeredAt,.registeredBy)' \
          > new-task-def.json

      - name: Register new task definition
        run: |
          NEW_TASK_DEF=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-def.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "NEW_TASK_DEF=$NEW_TASK_DEF" >> $GITHUB_ENV

      ############################################################
      # 7️⃣ Deploy New Version
      ############################################################
      - name: Deploy new task definition
        run: |
          aws ecs update-service \
            --cluster $CLUSTER_NAME \
            --service $SERVICE_NAME \
            --task-definition $NEW_TASK_DEF

      ############################################################
      # 8️⃣ Wait for Stability
      ############################################################
      - name: Wait for service stability
        run: |
          aws ecs wait services-stable \
            --cluster $CLUSTER_NAME \
            --services $SERVICE_NAME

      ############################################################
      # 9️⃣ Rollback if Failed
      ############################################################
      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed. Rolling back..."
          aws ecs update-service \
            --cluster $CLUSTER_NAME \
            --service $SERVICE_NAME \
            --task-definition $CURRENT_TASK_DEF

name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
  workflow_dispatch:
    inputs:
      bump_major:
        description: "Bump MAJOR version?"
        type: boolean
        default: false
      bump_minor:
        description: "Bump MINOR version?"
        type: boolean
        default: false
      bump_patch:
        description: "Bump PATCH version?"
        type: boolean
        default: true

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    env:
      CLUSTER_NAME: cluster-1
      SERVICE_NAME: frontend-task-service-ql1lkjuv
      TASK_FAMILY: frontend-task
      ECR_REPOSITORY: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Step 1: Get latest image tag from ECR or use default 0.0.0
      - name: Get latest image tag
        id: get-latest
        run: |
          LATEST_TAG=$(aws ecr describe-images \
            --repository-name $ECR_REPOSITORY \
            --query 'sort_by(imageDetails,& imagePushedAt)[-1].imageTags[0]' \
            --output text 2>/dev/null)

          if [ "$LATEST_TAG" == "None" ] || [ -z "$LATEST_TAG" ]; then
            echo "No previous image found. Using default 0.0.0"
            LATEST_TAG="0.0.0"
          else
            echo "Latest image tag found: $LATEST_TAG"
          fi

          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV

      # Step 2: Bump version based on workflow_dispatch input
      - name: Bump version
        id: version
        env:
          LATEST_TAG: ${{ env.LATEST_TAG }}
          BUMP_MAJOR: ${{ github.event.inputs.bump_major }}
          BUMP_MINOR: ${{ github.event.inputs.bump_minor }}
          BUMP_PATCH: ${{ github.event.inputs.bump_patch }}
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_TAG"

          if [ "$BUMP_MAJOR" == "true" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$BUMP_MINOR" == "true" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          elif [ "$BUMP_PATCH" == "true" ]; then
            PATCH=$((PATCH + 1))
          fi

          # After bumping MAJOR, MINOR, PATCH
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
            NEW_TAG="v$NEW_VERSION"

            echo "New version: $NEW_VERSION"
            echo "New image tag: $NEW_TAG"

          # Save new tag with v to VERSION file
            echo "$NEW_TAG" > backend/VERSION

          # Export IMAGE_TAG for Docker/ECS
            echo "IMAGE_TAG=$NEW_TAG" >> $GITHUB_ENV


      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push Frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          cd frontend
          echo "Building frontend image with tag: $IMAGE_TAG"
          export DOCKER_BUILDKIT=0
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Get current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition $TASK_FAMILY \
            --query taskDefinition > task-def.json

      - name: Update task definition with new image
        run: |
          NEW_IMAGE=${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG
          cat task-def.json | jq --arg IMAGE "$NEW_IMAGE" \
          '.containerDefinitions[0].image = $IMAGE 
          | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' \
          > new-task-def.json

      - name: Register new task definition
        run: |
          aws ecs register-task-definition \
            --cli-input-json file://new-task-def.json

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster $CLUSTER_NAME \
            --service $SERVICE_NAME \
            --force-new-deployment

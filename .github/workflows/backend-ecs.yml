name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
  workflow_dispatch:
    inputs:
      bump_major:
        description: "Bump MAJOR version?"
        type: boolean
        default: false
      bump_minor:
        description: "Bump MINOR version?"
        type: boolean
        default: false
      bump_patch:
        description: "Bump PATCH version?"
        type: boolean
        default: true

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    env:
      CLUSTER_NAME: cluster-1
      SERVICE_NAME: backend-task-service-53f3svqf
      TASK_FAMILY: backend-task
      ECR_REPOSITORY: backend

    steps:
      ############################################################
      # 1️⃣ Checkout Code
      ############################################################
      - name: Checkout code
        uses: actions/checkout@v3

      ############################################################
      # 2️⃣ Configure AWS Credentials
      ############################################################
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      ############################################################
      # 3️⃣ Get Highest Semantic Version From ECR
      ############################################################
      - name: Get latest semantic version
        id: get-latest
        run: |
          TAGS=$(aws ecr describe-images \
            --repository-name $ECR_REPOSITORY \
            --query 'imageDetails[].imageTags[]' \
            --output text 2>/dev/null | tr '\t' '\n' \
            | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' || true)

          if [ -z "$TAGS" ]; then
            echo "No valid semantic versions found."
            LATEST_TAG="0.0.0"
          else
            LATEST_TAG=$(echo "$TAGS" | sed 's/^v//' | sort -V | tail -n1)
            echo "Highest semantic version found: $LATEST_TAG"
          fi

          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV

      ############################################################
      # 4️⃣ Validate Version Format
      ############################################################
      - name: Validate version format
        run: |
          if [[ ! "$LATEST_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format: $LATEST_TAG"
            exit 1
          fi

      ############################################################
      # 5️⃣ Bump Version Safely
      ############################################################
      - name: Bump version
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_TAG"

          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          if [ "${{ github.event.inputs.bump_major }}" == "true" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "${{ github.event.inputs.bump_minor }}" == "true" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          NEW_TAG="v$NEW_VERSION"

          echo "Deploying version: $NEW_TAG"

          echo "$NEW_TAG" > backend/VERSION
          echo "IMAGE_TAG=$NEW_TAG" >> $GITHUB_ENV

      ############################################################
      # 6️⃣ Login to ECR & Build Image
      ############################################################
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push Backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          cd backend
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      ############################################################
      # 7️⃣ Save Current Task Definition (Rollback Backup)
      ############################################################
      - name: Save current task definition
        run: |
          CURRENT_TASK_DEF=$(aws ecs describe-services \
            --cluster $CLUSTER_NAME \
            --services $SERVICE_NAME \
            --query 'services

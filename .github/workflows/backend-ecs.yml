name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
  workflow_dispatch:
    inputs:
      bump_major:
        description: "Bump MAJOR version?"
        type: boolean
        default: false
      bump_minor:
        description: "Bump MINOR version?"
        type: boolean
        default: false
      bump_patch:
        description: "Bump PATCH version?"
        type: boolean
        default: true
      custom_tag_suffix:
        description: "Optional custom tag suffix (e.g. -dev, -staging)"
        type: string
        default: ""

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    env:
      CLUSTER_NAME: cluster-1
      SERVICE_NAME: backend-task-service-53f3svqf
      TASK_FAMILY: backend-task
      ECR_REPOSITORY: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      ############################################################
      # 1️⃣ Get Highest Semantic Version From ECR (Suffix-Aware)
      ############################################################
      - name: Get latest semantic version for suffix
        id: get-latest
        run: |
          SUFFIX="${{ github.event.inputs.custom_tag_suffix }}"

          # Get all tags
          TAGS=$(aws ecr describe-images \
            --repository-name $ECR_REPOSITORY \
            --query 'imageDetails[].imageTags[]' \
            --output text 2>/dev/null | tr '\t' '\n' || true)

          # Filter tags by suffix if provided
          if [ -n "$SUFFIX" ]; then
            TAGS=$(echo "$TAGS" | grep -F "$SUFFIX" || true)
          fi

          if [ -z "$TAGS" ]; then
            echo "No tags found for suffix '$SUFFIX'. Starting from 0.0.0"
            LATEST_TAG="0.0.0"
          else
            CLEAN_VERSIONS=$(echo "$TAGS" \
              | sed 's/^v//' \
              | sed -E 's/[^0-9.].*$//' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true)

            if [ -z "$CLEAN_VERSIONS" ]; then
              LATEST_TAG="0.0.0"
            else
              LATEST_TAG=$(echo "$CLEAN_VERSIONS" | sort -V | tail -n1)
            fi
            echo "Latest numeric version for suffix '$SUFFIX': $LATEST_TAG"
          fi

          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV

      ############################################################
      # 2️⃣ Validate Version Format
      ############################################################
      - name: Validate version format
        run: |
          if [[ ! "$LATEST_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format: $LATEST_TAG"
            exit 1
          fi

      ############################################################
      # 3️⃣ Bump Version & Set Custom Tag
      ############################################################
      - name: Bump version and set custom tag
        run: |
          SUFFIX="${{ github.event.inputs.custom_tag_suffix }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_TAG"

          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          if [ "${{ github.event.inputs.bump_major }}" == "true" ]; then
            MAJOR=$((MAJOR + 1))
          fi
          if [ "${{ github.event.inputs.bump_minor }}" == "true" ]; then
            MINOR=$((MINOR + 1))
          fi
          if [ "${{ github.event.inputs.bump_patch }}" == "true" ]; then
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          IMAGE_TAG="v$NEW_VERSION$SUFFIX"

          echo "Deploying image with tag: $IMAGE_TAG"

          echo "$IMAGE_TAG" > backend/VERSION
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      ############################################################
      # 4️⃣ Login to ECR
      ############################################################
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      ############################################################
      # 5️⃣ Build & Push Backend image using Compose
      ############################################################
      - name: Build Backend image using Docker Compose
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          export DOCKER_BUILDKIT=0
          export IMAGE_TAG=$IMAGE_TAG
          echo "Building backend image with tag: $IMAGE_TAG"
          docker compose -f docker-compose.backend.ci.yml build
          docker tag backend:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      ############################################################
      # 6️⃣ Save Current Task Definition (for rollback)
      ############################################################
      - name: Save current task definition
        run: |
          CURRENT_TASK_DEF=$(aws ecs describe-services \
            --cluster $CLUSTER_NAME \
            --services $SERVICE_NAME \
            --query 'services[0].taskDefinition' \
            --output text)
          echo "CURRENT_TASK_DEF=$CURRENT_TASK_DEF" >> $GITHUB_ENV

      ############################################################
      # 7️⃣ Register New Task Definition
      ############################################################
      - name: Get current task definition JSON
        run: |
          aws ecs describe-task-definition \
            --task-definition $TASK_FAMILY \
            --query taskDefinition > task-def.json

      - name: Update task definition with new image
        run: |
          NEW_IMAGE=${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG

          cat task-def.json | jq --arg IMAGE "$NEW_IMAGE" \
          '.containerDefinitions[0].image = $IMAGE
          | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,
                .compatibilities,.registeredAt,.registeredBy)' \
          > new-task-def.json

      - name: Register new task definition
        run: |
          NEW_TASK_DEF=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-def.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "NEW_TASK_DEF=$NEW_TASK_DEF" >> $GITHUB_ENV

      ############################################################
      # 8️⃣ Deploy New Version
      ############################################################
      - name: Deploy new task definition
        run: |
          aws ecs update-service \
            --cluster $CLUSTER_NAME \
            --service $SERVICE_NAME \
            --task-definition $NEW_TASK_DEF

      ############################################################
      # 9️⃣ Wait for Stability
      ############################################################
      - name: Wait for service stability
        run: |
          aws ecs wait services-stable \
            --cluster $CLUSTER_NAME \
            --services $SERVICE_NAME

      ############################################################
      # 🔟 Rollback if Failed
      ############################################################
      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed. Rolling back..."
          aws ecs update-service \
            --cluster $CLUSTER_NAME \
            --service $SERVICE_NAME \
            --task-definition $CURRENT_TASK_DEF
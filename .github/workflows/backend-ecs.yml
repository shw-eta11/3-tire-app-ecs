name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
    paths-ignore:
      - 'backend/VERSION'
  workflow_dispatch:
    inputs:
      bump_major:
        description: "Bump MAJOR version?"
        type: boolean
        default: false
      bump_minor:
        description: "Bump MINOR version?"
        type: boolean
        default: false

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    env:
      CLUSTER_NAME: cluster-1
      SERVICE_NAME: backend-task-service-53f3svqf
      TASK_FAMILY: backend-task
      ECR_REPOSITORY: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Step 1: Read and bump semantic version
      - name: Read and bump version
        id: version
        env:
          BUMP_MAJOR: ${{ github.event.inputs.bump_major }}
          BUMP_MINOR: ${{ github.event.inputs.bump_minor }}
        run: |
          VERSION=$(cat backend/VERSION)
          echo "Current version: $VERSION"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          if [ "$BUMP_MAJOR" == "true" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$BUMP_MINOR" == "true" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "New version: $NEW_VERSION"

          echo "$NEW_VERSION" > backend/VERSION
          echo "IMAGE_TAG=$NEW_VERSION" >> $GITHUB_ENV

      # Step 2: Commit updated VERSION file
      - name: Commit and push new version
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add backend/VERSION
          git commit -m "Bump backend version to $IMAGE_TAG" || echo "No changes to commit"
          git push

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push Backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          cd backend
          echo "Building backend image with version: $IMAGE_TAG"
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Get current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition $TASK_FAMILY \
            --query taskDefinition > task-def.json

      - name: Update task definition with new image
        run: |
          NEW_IMAGE=${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG
          cat task-def.json | jq --arg IMAGE "$NEW_IMAGE" \
          '.containerDefinitions[0].image = $IMAGE 
          | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' \
          > new-task-def.json

      - name: Register new task definition
        run: |
          aws ecs register-task-definition \
            --cli-input-json file://new-task-def.json

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster $CLUSTER_NAME \
            --service $SERVICE_NAME \
            --force-new-deployment
